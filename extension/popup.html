<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromptX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      background: #6366f1;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: white;
    }
    .logo-text { font-size: 15px; font-weight: 700; }
    .sync-btn {
      background: rgba(99,102,241,0.15);
      color: #818cf8;
      border: 1px solid rgba(99,102,241,0.3);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sync-btn:hover { background: rgba(99,102,241,0.25); }
    .sync-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .sync-status {
      font-size: 10px;
      color: #666;
      margin-bottom: 10px;
      min-height: 14px;
    }
    .sync-status.success { color: #34d399; }
    .sync-status.error { color: #f87171; }
    .info { font-size: 12px; color: #888; line-height: 1.6; margin-bottom: 12px; }
    .section { margin-bottom: 12px; }
    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #555;
      margin-bottom: 6px;
    }
    .cmd-list { list-style: none; }
    .cmd-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      font-size: 12px;
    }
    .cmd-command {
      font-family: "SF Mono", "Fira Code", monospace;
      background: rgba(99,102,241,0.12);
      color: #6366f1;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      flex-shrink: 0;
    }
    .cmd-title { color: #ccc; }
    .cmd-cat { margin-left: auto; font-size: 10px; color: #444; }
    .footer {
      font-size: 10px;
      color: #555;
      text-align: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.04);
    }
    .footer a { color: #6366f1; text-decoration: none; }
    .loading { text-align: center; color: #666; font-size: 12px; padding: 20px 0; }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(99,102,241,0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">P</div>
      <span class="logo-text">PromptX</span>
    </div>
    <button class="sync-btn" id="syncBtn" title="从线上拉取最新提示词">同步</button>
  </div>
  <div class="sync-status" id="syncStatus"></div>

  <div class="info">
    在 AI 聊天框输入 <strong>\</strong> 唤起指令菜单，一键填入模板。
  </div>

  <div class="section">
    <div class="section-title" id="cmdCount">可用指令</div>
    <ul class="cmd-list" id="cmdList">
      <li class="loading"><span class="spinner"></span>加载中...</li>
    </ul>
  </div>

  <div class="footer">
    <a href="https://nicoliustudio.github.io/PromptX/" target="_blank">打开 PromptX 管理面板</a>
  </div>

  <script src="prompts.js"></script>
  <script src="popup.js"></script>
</body>
</html>
